<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="100%" stop-color="#054da7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Central Emblem / Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Document / Shield Contour -->
    <path d="M160 120 H300 L360 180 V370 C360 381 351 390 340 390 H160 C149 390 140 381 140 370 V140 C140 129 149 120 160 120 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Folded Corner -->
    <path d="M300 120 V180 H360" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />

    <!-- Stylized Monogram V A -->
    <text x="256" y="305" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="145" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-4">VA</text>
  </g>

  <!-- Tech Dots / Signal nodes representing Automation & Control -->
  <circle cx="210" cy="340" r="7" fill="#54aeff" />
  <circle cx="256" cy="340" r="7" fill="#ffffff" />
  <circle cx="302" cy="340" r="7" fill="#54aeff" />
  <line x1="210" y1="340" x2="302" y2="340" stroke="#54aeff" stroke-width="3" stroke-opacity="0.7" />
</svg>
